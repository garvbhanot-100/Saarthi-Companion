kind = "mobile"
previewPath = "/"
title = "Saarthi AI"
description = "A mobile-first guide that helps Indian users understand government services and schemes in simple language, with searchable official sources, AI guidance, saved services, and personal chat history."
version = "1.0.0"
id = "artifacts/saarthi-ai"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18086

[services.development]
run = "pnpm --filter @workspace/saarthi-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saarthi-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/saarthi-ai", "run", "serve" ]

[services.env]
PORT = "18086"
BASE_PATH = "/"
